name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check rule copies
        run: node scripts/check-rule-copies.js

      - name: Check version consistency
        run: node scripts/check-versions.js

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm.cmd test

      - name: Run tests on Unix
        if: runner.os != 'Windows'
        run: npm test

      - name: Verify npm package contents on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm.cmd pack --dry-run

      - name: Verify npm package contents on Unix
        if: runner.os != 'Windows'
        run: npm pack --dry-run

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run benchmark selftest
        run: python benchmarks/agentic/run.py --selftest

