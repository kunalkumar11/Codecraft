<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">CodeCraft</title>
  <desc id="desc">A continuous teal line forms a C with a golden anchor — CodeCraft: the smallest change that works.</desc>
  <!-- Background rounded square -->
  <rect width="128" height="128" rx="28" fill="#0D1B2A"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 L0 0 0 16" fill="none" stroke="#1A3A5C" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#F3B95F"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#grid)"/>
  <!-- Main C shape - continuous line -->
  <path d="M88 28
           C74 28 62 38 62 52
           C62 66 74 76 88 76
           C102 76 114 66 114 52
           C114 38 102 28 88 28"
        fill="none"
        stroke="url(#tealGrad)"
        stroke-width="8"
        stroke-linecap="round"
        filter="url(#glow)"/>
  <!-- Inner accent line -->
  <path d="M80 32
           C70 32 62 40 62 50
           C62 60 70 68 80 68"
        fill="none"
        stroke="#0D1B2A"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.6"/>
  <!-- Golden anchor point (the "craft" - deliberate, precise) -->
  <circle cx="92" cy="28" r="8" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Small tick marks on the C - representing precision/measurement -->
  <g stroke="#65D6BA" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="48" y1="52" x2="56" y2="52"/>
    <line x1="96" y1="68" x2="104" y2="68"/>
    <line x1="48" y1="76" x2="56" y2="76"/>
  </g>
  <!-- Subtle corner brackets (code editor vibe) -->
  <g stroke="#1A3A5C" stroke-width="1.5" opacity="0.5">
    <path d="M18 18 L30 18 M18 18 L18 30"/>
    <path d="M110 18 L98 18 M110 18 L110 30"/>
    <path d="M18 110 L30 110 M18 110 L18 98"/>
    <path d="M110 110 L98 110 M110 110 L110 98"/>
  </g>
</svg>